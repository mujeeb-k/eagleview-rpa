# Ironbridge Teller 7: what is true of the product on every tenant, whatever the task. Authored by
# hand, once per vendor product, and reviewed like any artifact. Every capability on every tenant
# inherits these global states. tests/replay/test_app_profile.py resolves each locator here
# against the live mock bank.
schema_version: "1.0"
id: ironbridge-teller
title: Ironbridge Teller 7
versions: ">=7.2,<8.0"
surface: legacy_web
fingerprint:
  detect: { text_matches: { pattern: "Ironbridge Teller v7\\.\\d+\\.\\d+" } }
  version: { pattern: "Ironbridge Teller v(?P<version>\\d+\\.\\d+\\.\\d+)" }
login:
  entry_path: /signon
  steps:
    - id: enter_username
      action: fill
      value: "{{ credentials.username }}"
      target: { locators: [ { strategy: anchor, anchor_text: ["Operator ID", "User ID"], relation: right_of, control: textbox }, { strategy: css, selector: "input[name='f1']" } ] }
    - id: enter_password
      action: fill
      value: "{{ credentials.password }}"
      target: { locators: [ { strategy: anchor, anchor_text: ["Password"], relation: right_of, control: textbox }, { strategy: css, selector: "input[type='password']" } ] }
    - id: sign_on
      action: click
      target: { locators: [ { strategy: a11y, role: button, name: "Sign On" }, { strategy: text, text: "Sign On" } ] }
  success: { text_present: { frame: banner, text: "Teller" } }
global_states:
  # Checked in this order during every wait. Signing on again restarts the flow, and is allowed
  # only before an irreversible step; after one, the engine reports OUTCOME_UNCERTAIN instead.
  - id: session_expired
    detect: { text_present: { text: "SESSION EXPIRED" } }
    recover: { type: relogin_and_restart }
    max_per_run: 1
    fail: { category: SESSION_LOST }
  - id: app_error
    detect: { text_present: { text: "SYSTEM ERROR" } }
    recover: { type: retry_step_if_idempotent }
    max_per_run: 1
    fail: { category: APP_ERROR }
  - id: system_notice
    detect: { text_present: { text: "System Notice" } }
    recover:
      type: dismiss
      click: { locators: [ { strategy: a11y, role: button, name: "OK" }, { strategy: text, text: "OK" } ] }
    max_per_run: 2
    fail: { category: RECOVERY_EXHAUSTED }
  - id: permission_denied
    detect: { text_present: { text: "ACCESS DENIED" } }
    outcome: { code: NOT_PERMITTED, message: "The operator's role lacks rights for this screen." }
  - id: maintenance_banner
    detect: { text_matches: { pattern: "(?i)unavailable for scheduled maintenance" } }
    fail: { category: APP_UNAVAILABLE, retryable: true }

schema_version: '1.0'
id: share.open_share_account
version: 1.0.0
title: Open a new share account of a chosen type for a member.
description: Looks up a member by member number in Member Inquiry, opens the Open Share form, 
  selects the requested share type such as Money Market, and posts it. This changes data by creating
  a new share account for the member. It returns no data fields.
status: verified
app:
  profile: ironbridge-teller
  versions: '>=7.2,<8.0'
risk: irreversible
requires_session: true
inputs:
  member_id:
    type: string
    pattern: ^[0-9]{4,10}$
    required: true
    sensitivity: identifier
    description: The member number identifying the member who will own the new share account.
    example: '10482'
  account_type:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9 &/\-]{1,39}$
    required: true
    sensitivity: none
    description: The share account type to open, as shown in the share type drop-down list.
    example: Money Market
outputs: {}
outcomes: []
steps:
  - id: open_member_inquiry
    intent: Open the Member Inquiry screen from the navigation menu.
    action:
      type: click
    target:
      description: "'Member Inquiry' link in frame nav"
      frame:
        - nav
      locators:
        - strategy: a11y
          role: link
          name: Member Inquiry
        - strategy: anchor
          anchor_text:
            - FUNCTIONS
          relation: below
          control: link
        - strategy: text
          text: Member Inquiry
          exact: true
        - strategy: css
          selector: a[href="/inq"]
        - strategy: xpath
          expression: //a[normalize-space(.)='Member Inquiry']
        - strategy: point
          x: 55
          y: 83
          bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
      fragile: false
    risk: read
    idempotent: true
    requires_approval: false
    expect:
      all:
        - text_present:
            frame:
              - main
            text: Member Search
        - element_present:
            target:
              description: textbox in frame main
              frame:
                - main
              locators:
                - strategy: anchor
                  anchor_text:
                    - 'Member #'
                  relation: right_of
                  control: textbox
                - strategy: anchor
                  anchor_text:
                    - Member Search
                  relation: below
                  control: textbox
                - strategy: css
                  selector: input[name="txtA"]
                - strategy: xpath
                  expression: "//tr[normalize-space(*[1])='Member #']//input"
                - strategy: point
                  x: 295
                  y: 134
                  bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
              fragile: false
    timeout_ms: 8000
  - id: enter_member_id
    intent: 'Enter the member number in the Member # field to search for the member.'
    action:
      type: fill
      value: '{{ inputs.member_id }}'
    target:
      description: textbox in frame main
      frame:
        - main
      locators:
        - strategy: anchor
          anchor_text:
            - 'Member #'
          relation: right_of
          control: textbox
        - strategy: anchor
          anchor_text:
            - Member Search
          relation: below
          control: textbox
        - strategy: css
          selector: input[name="txtA"]
        - strategy: xpath
          expression: "//tr[normalize-space(*[1])='Member #']//input"
        - strategy: point
          x: 295
          y: 134
          bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
      fragile: false
    risk: read
    idempotent: true
    requires_approval: false
    expect:
      field_value:
        target: self
        equals: '{{ inputs.member_id }}'
    timeout_ms: 8000
  - id: submit_member_search
    intent: Click the GO image to run the search and display the member detail page.
    action:
      type: click
    target:
      description: img in frame main
      frame:
        - main
      locators:
        - strategy: anchor
          anchor_text:
            - 'Member #'
          relation: right_of
          control: image
        - strategy: css
          selector: img[src="/img/go.svg"]
        - strategy: xpath
          expression: "//tr[normalize-space(*[1])='Member #']//img"
        - strategy: point
          x: 418
          y: 135
          bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
      fragile: false
    risk: read
    idempotent: true
    requires_approval: false
    expect:
      all:
        - text_present:
            frame:
              - main
            text: Member Detail
        - element_present:
            target:
              description: "'Open Share' button in frame main"
              frame:
                - main
              locators:
                - strategy: a11y
                  role: button
                  name: Open Share
                - strategy: anchor
                  anchor_text:
                    - Date
                  relation: below
                  control: button
                - strategy: text
                  text: Open Share
                  exact: true
                - strategy: css
                  selector: input[type="button"][value="Open Share"]
                - strategy: xpath
                  expression: //input[@value='Open Share']
                - strategy: point
                  x: 222
                  y: 777
                  bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
              fragile: false
    timeout_ms: 8000
  - id: click_open_share
    intent: Click the Open Share button to start opening a new share account.
    action:
      type: click
    target:
      description: "'Open Share' button in frame main"
      frame:
        - main
      locators:
        - strategy: a11y
          role: button
          name: Open Share
        - strategy: anchor
          anchor_text:
            - Date
          relation: below
          control: button
        - strategy: text
          text: Open Share
          exact: true
        - strategy: css
          selector: input[type="button"][value="Open Share"]
        - strategy: xpath
          expression: //input[@value='Open Share']
        - strategy: point
          x: 222
          y: 777
          bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
      fragile: false
    risk: read
    idempotent: true
    requires_approval: false
    expect:
      all:
        - text_present:
            frame:
              - main
            text: Open Share Account
        - element_present:
            target:
              description: combobox in frame main
              frame:
                - main
              locators:
                - strategy: anchor
                  anchor_text:
                    - Share Type
                  relation: right_of
                  control: select
                - strategy: anchor
                  anchor_text:
                    - '[member]'
                  relation: below
                  control: select
                - strategy: css
                  selector: select[name="f3"]
                - strategy: xpath
                  expression: //tr[normalize-space(*[1])='Share Type']//select
                - strategy: point
                  x: 358
                  y: 167
                  bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
              fragile: false
    timeout_ms: 8000
  - id: select_share_type
    intent: Choose the share type from the drop-down list using the account_type input.
    action:
      type: select
      option: '{{ inputs.account_type }}'
    target:
      description: combobox in frame main
      frame:
        - main
      locators:
        - strategy: anchor
          anchor_text:
            - Share Type
          relation: right_of
          control: select
        - strategy: anchor
          anchor_text:
            - '[member]'
          relation: below
          control: select
        - strategy: css
          selector: select[name="f3"]
        - strategy: xpath
          expression: //tr[normalize-space(*[1])='Share Type']//select
        - strategy: point
          x: 358
          y: 167
          bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
      fragile: false
    risk: write_staged
    idempotent: true
    requires_approval: false
    expect:
      field_value:
        target: self
        equals: '{{ inputs.account_type }}'
    timeout_ms: 8000
  - id: confirm_selection
    intent: Press a key to confirm the selected share type in the form.
    action:
      type: press
      key: Return
    risk: write_staged
    idempotent: true
    requires_approval: false
    expect:
      all:
        - text_present:
            frame:
              - main
            text: Review - Open Share
        - element_present:
            target:
              description: "'Post' button in frame main"
              frame:
                - main
              locators:
                - strategy: a11y
                  role: button
                  name: Post
                - strategy: text
                  text: Post
                  exact: true
                - strategy: css
                  selector: input[type="submit"][value="Post"]
                - strategy: xpath
                  expression: //input[@value='Post']
                - strategy: point
                  x: 200
                  y: 308
                  bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
              fragile: false
    timeout_ms: 8000
  - id: post_new_share
    intent: Click Post to commit and create the new share account.
    action:
      type: click
    target:
      description: "'Post' button in frame main"
      frame:
        - main
      locators:
        - strategy: a11y
          role: button
          name: Post
        - strategy: text
          text: Post
          exact: true
        - strategy: css
          selector: input[type="submit"][value="Post"]
        - strategy: xpath
          expression: //input[@value='Post']
        - strategy: point
          x: 200
          y: 308
          bound_to_fingerprint: ironbridge-teller@7.2/lantern-bay
      fragile: false
    risk: irreversible
    idempotent: false
    requires_approval: true
    expect:
      text_present:
        frame:
          - main
        text: Share Account Opened
    timeout_ms: 8000
success:
  text_present:
    frame:
      - main
    text: Share Account Opened

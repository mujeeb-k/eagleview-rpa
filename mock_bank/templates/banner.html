<html>
<head><title>banner</title></head>
<body bgcolor="{{ t.theme.banner_bg }}" topmargin="0" leftmargin="0" marginheight="0" marginwidth="0">
<table width="100%" height="56" border="0" cellspacing="0" cellpadding="4"><tr>
<td width="200" valign="middle"><img src="/img/logo.svg" width="190" height="40" border="0"></td>
<td valign="middle"><font face="Arial" size="1" color="{{ t.theme.banner_fg }}">
Teller: <b>{{ s.username }}</b> ({{ t.teller_id }}) &nbsp; Drawer {{ t.drawer }}<br>
Branch: {{ branch }} &nbsp; Business Date: {{ business_date | mdy }}</font></td>
<td align="right" valign="middle"><font face="Arial" size="1" color="{{ t.theme.banner_fg }}">
Session <b class="cd">{{ '%d:%02d' % (idle_s // 60, idle_s % 60) }}</b> &nbsp;
<a href="/signoff" target="_top"><font color="{{ t.theme.banner_fg }}">Sign Off</font></a></font></td>
</tr></table>
<script>
// Client-side only: no polling, no refresh, so it never touches the server or the request count.
var left = {{ idle_s }};
setInterval(function () {
  if (left > 0) { left--; }
  var m = Math.floor(left / 60), s = left % 60;
  document.getElementsByClassName('cd')[0].innerHTML = m + ':' + (s < 10 ? '0' : '') + s;
}, 1000);
</script>
</body>
</html>
